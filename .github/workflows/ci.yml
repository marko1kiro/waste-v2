name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (frontend + shared)
        run: npm run typecheck

      - name: Typecheck (API)
        run: npm run typecheck:api

      - name: Build
        run: npm run build
